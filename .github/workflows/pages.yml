# Publishes the website in site/ to GitHub Pages (https://erik1028.github.io/OrbitOverlay/).
# The screenshots (docs/img) and the changelog (docs/CHANGELOG.md) are copied in at build time,
# so the site always shows the same pictures and "What's new" as the app.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/img/**"
      - "docs/CHANGELOG.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site/img
          cp -r site/. _site/
          cp -r docs/img/. _site/img/
          cp docs/CHANGELOG.md _site/CHANGELOG.md

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
