Description: |-
  OrbitOverlay is a free SteamVR overlay for Windows. It puts a customizable watch on your wrist, your monitors and
  app windows around you as curved screens you control with a laser mouse, and a VR keyboard that opens when you
  click a text field. It also has VRChat extras, layout profiles, night mode and an optional Windows 95 style.
